name: Build and Push to ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build backend
        run: dotnet build ./backend/AwsDevOpsBackend/AwsDevOpsBackend.csproj --configuration Release

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/aws-devops-sample-frontend:$IMAGE_TAG \
            -t $REGISTRY/aws-devops-sample-frontend:latest \
            ./frontend

          docker push $REGISTRY/aws-devops-sample-frontend:$IMAGE_TAG
          docker push $REGISTRY/aws-devops-sample-frontend:latest

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/aws-devops-sample-backend:$IMAGE_TAG \
            -t $REGISTRY/aws-devops-sample-backend:latest \
            ./backend/AwsDevOpsBackend

          docker push $REGISTRY/aws-devops-sample-backend:$IMAGE_TAG
          docker push $REGISTRY/aws-devops-sample-backend:latest
