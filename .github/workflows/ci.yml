name: CI-CD Pipeline
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build backend
        run: dotnet build ./backend/AwsDevOpsBackend/AwsDevOpsBackend.csproj --configuration Release

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/aws-devops-sample-frontend:$IMAGE_TAG \
            -t $REGISTRY/aws-devops-sample-frontend:latest \
            ./frontend

          docker push $REGISTRY/aws-devops-sample-frontend:$IMAGE_TAG
          docker push $REGISTRY/aws-devops-sample-frontend:latest

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/aws-devops-sample-backend:$IMAGE_TAG \
            -t $REGISTRY/aws-devops-sample-backend:latest \
            ./backend/AwsDevOpsBackend

          docker push $REGISTRY/aws-devops-sample-backend:$IMAGE_TAG
          docker push $REGISTRY/aws-devops-sample-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy frontend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY=$ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ vars.FRONTEND_INSTANCE_ID }}" \
            --parameters '{"commands":["aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin '$REGISTRY'","docker pull '$REGISTRY'/aws-devops-sample-frontend:latest","docker rm -f aws-devops-frontend-container || true","docker run -d --name aws-devops-frontend-container -p 80:80 '$REGISTRY'/aws-devops-sample-frontend:latest"]}' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.FRONTEND_INSTANCE_ID }}"

      - name: Deploy backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY=$ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ vars.BACKEND_INSTANCE_ID }}" \
            --parameters '{"commands":["aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin '$REGISTRY'","docker pull '$REGISTRY'/aws-devops-sample-backend:latest","docker rm -f aws-devops-backend-container || true","docker run -d --name aws-devops-backend-container -p 8080:8080 '$REGISTRY'/aws-devops-sample-backend:latest"]}' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.BACKEND_INSTANCE_ID }}"